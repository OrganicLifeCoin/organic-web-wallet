name: Wallet checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the wallet image dependency order
        run: tests/dockerfile.test.sh

      - name: Check repository hygiene
        run: bash tests/repository-hygiene.test.sh

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Run the complete test suite
        run: npm test -- --run

      - name: Build the production wallet
        run: npm run build
